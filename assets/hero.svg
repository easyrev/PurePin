    <rect x="647" y="561" width="99" height="36" rx="9" fill="#3565ED"/>
    <path d="M665 570H677V584H665V570ZM661 575V589H674" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="705" y="585" text-anchor="middle" font-size="16" font-weight="600" fill="white">复制</text>

    <path d="M1155 222C1250 245 1289 297 1264 367" stroke="#9BA9BF" stroke-width="2" stroke-dasharray="5 8" stroke-linecap="round"/>
    <path d="M1255 354L1264 368L1277 358" stroke="#9BA9BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1167" y="207" font-size="22" font-weight="550" fill="#536987" transform="rotate(7 1167 207)">贴在手边</text>

    <g transform="rotate(5 1090 531)">
      <g filter="url(#pinShadow)">
        <rect x="915" y="374" width="334" height="309" rx="5" fill="#FFFFFF"/>
      </g>
      <rect x="929" y="388" width="306" height="193" rx="2" fill="#D6E2FF"/>
      <circle cx="1082" cy="484" r="65" fill="#3565ED"/>
      <path d="M1048 443H1116V531L1082 510L1048 531V443Z" fill="#F8FAFF"/>
      <text x="945" y="620" font-size="25" font-weight="650" fill="#314770">这版就用蓝色</text>
      <text x="945" y="653" font-size="18" fill="#8B98AE">抬眼就能看见，不用来回切。</text>
      <circle cx="1082" cy="377" r="13" fill="#E9EFFF" stroke="#B7CAFA"/>
      <circle cx="1082" cy="376" r="5" fill="#3565ED"/>
    </g>

    <g transform="translate(106 709)">
      <rect width="43" height="34" rx="7" fill="#FFFFFF" stroke="#D5D9E0"/>
      <text x="21.5" y="23" text-anchor="middle" font-size="17" font-weight="600" fill="#536077">F1</text>
      <text x="59" y="23" font-size="18" fill="#7D8794">截下来</text>
      <path d="M142 17H175M169 11L175 17L169 23" stroke="#A0ABBC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="194" y="23" font-size="18" fill="#7D8794">标两笔</text>
      <path d="M277 17H310M304 11L310 17L304 23" stroke="#A0ABBC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="329" y="23" font-size="18" fill="#7D8794">复制出去，或留在眼前</text>
    </g>
    <text x="1339" y="766" text-anchor="end" font-size="13" letter-spacing="1.5" fill="#8B9199">功能示意 · ILLUSTRATION</text>
  </g>
</svg>
